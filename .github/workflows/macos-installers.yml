name: Build MaXiaoMa macOS installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Build and verify native application
        run: python3 packaging/macos/build.py --arch "${{ matrix.arch }}"
      - name: Upload verified installer and report
        uses: actions/upload-artifact@v4
        with:
          name: MaXiaoMa-macOS-${{ matrix.arch }}
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14
