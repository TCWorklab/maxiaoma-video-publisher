name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check launcher syntax
        run: bash -n start.sh && bash -n start-macos.sh && bash -n update.sh
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Account maintenance tests with isolated data
        working-directory: backend
        env:
          SAU_DATA_DIR: ${{ runner.temp }}/maxiaoma-test-data
          PYTHONUTF8: '1'
        run: python -m unittest tests.test_account_maintenance -v
      - name: Fresh instance startup
        run: python scripts/check_fresh_start.py
